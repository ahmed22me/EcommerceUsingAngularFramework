<div class="container mx-auto my-6">
  <div class="row">
    <div class="md:w-9/12">
      <owl-carousel-o [options]="customOptions">
        <ng-template carouselSlide><img src="assets/images/slider-image-1.jpeg" alt=""></ng-template>
        <ng-template carouselSlide><img src="assets/images/slider-image-2.jpeg" alt=""></ng-template>
        <ng-template carouselSlide><img src="assets/images/slider-image-3.jpeg" alt=""></ng-template>
      </owl-carousel-o>
    </div>
    <div class="md:w-3/12 static-img">
      <img src="assets/images/slider-image-1.jpeg" class="w-full" alt="image-slider">
      <img src="assets/images/slider-image-2.jpeg" class="w-full" alt="image-slider">
    </div>
  </div>

</div>
